# ═══════════════════════════════════════════════════════════════
# Cloud Build — Nilamit Firebase App Hosting Pipeline
# Runs Prisma migrations → builds Next.js → deploys to Cloud Run
#
# This file is used by Firebase App Hosting automatically.
# You do NOT need to trigger this manually.
# ═══════════════════════════════════════════════════════════════

steps:
  # ── Step 1: Install dependencies ──────────────────────────────
  - name: "node:20"
    id: install
    entrypoint: npm
    args: ["ci", "--prefer-offline"]

  # ── Step 2: Build Next.js (generates Prisma client + builds app)
  - name: "node:20"
    id: build
    entrypoint: npm
    args: ["run", "build"]
    secretEnv:
      - AUTH_SECRET
    waitFor:
      - install

# ── Secrets pulled from Google Secret Manager ─────────────────
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/AUTH_SECRET/versions/latest
      env: AUTH_SECRET

# ── Build options ──────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8    # Faster build, reduces cold start penalty

# ── Timeout ────────────────────────────────────────────────────
timeout: 1200s   # 20 minutes — generous for first build with Prisma generate
