# ═══════════════════════════════════════════════════════════════
# Cloud Build — Nilamit Firebase App Hosting Pipeline
# Installs deps → builds Next.js → App Hosting deploys the output.
#
# This file is used by Firebase App Hosting automatically.
# You do NOT need to trigger this manually.
# ═══════════════════════════════════════════════════════════════

steps:
  # ── Step 1: Install dependencies ──────────────────────────────
  - name: "node:20"
    id: install
    entrypoint: npm
    args: ["ci", "--prefer-offline"]

  # ── Step 2: Build Next.js
  - name: "node:20"
    id: build
    entrypoint: npm
    args: ["run", "build"]
    secretEnv:
      - AUTH_SECRET
    waitFor:
      - install

# ── Secrets pulled from Google Secret Manager ─────────────────
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/AUTH_SECRET/versions/latest
      env: AUTH_SECRET

# ── Build options ──────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8    # Faster build, reduces cold start penalty

# ── Timeout ────────────────────────────────────────────────────
timeout: 900s    # 15 minutes — Next.js build only, no codegen step
