# ═══════════════════════════════════════════════════════════════
# Cloud Build — Nilamit Firebase App Hosting Pipeline
# Installs deps → builds Next.js → App Hosting deploys the output.
#
# This file is used by Firebase App Hosting automatically.
# You do NOT need to trigger this manually.
# ═══════════════════════════════════════════════════════════════

steps:
  # ── Step 1: Install dependencies ──────────────────────────────
  # Using npm install instead of npm ci: the lockfile was generated on Windows
  # and omits Linux-only optional packages (@emnapi/*, @img/sharp-linux-*),
  # which causes npm ci to fail with "missing packages" on the Cloud Build
  # Linux runner. Regenerate the lockfile on Linux to restore npm ci:
  #   docker run --rm -v $(pwd):/app -w /app node:20 npm install
  - name: "node:20"
    id: install
    entrypoint: npm
    args: ["install", "--no-audit", "--no-fund"]

  # ── Step 2: Build Next.js
  - name: "node:20"
    id: build
    entrypoint: npm
    args: ["run", "build"]
    secretEnv:
      - AUTH_SECRET
      - SENTRY_AUTH_TOKEN
      - SENTRY_DSN
    waitFor:
      - install

# ── Secrets pulled from Google Secret Manager ─────────────────
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/AUTH_SECRET/versions/latest
      env: AUTH_SECRET
    - versionName: projects/$PROJECT_ID/secrets/SENTRY_AUTH_TOKEN/versions/latest
      env: SENTRY_AUTH_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/SENTRY_DSN/versions/latest
      env: SENTRY_DSN

# ── Build options ──────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8    # Faster build, reduces cold start penalty

# ── Timeout ────────────────────────────────────────────────────
timeout: 900s    # 15 minutes — Next.js build only, no codegen step
