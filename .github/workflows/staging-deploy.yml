name: Staging deploy
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Cancel in-flight staging builds when a PR is updated — only the latest commit
# of the PR ever needs to be live on staging.
concurrency:
  group: staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  deploy:
    name: Build + deploy to nilamit-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      # Re-patch @emnapi after npm ci — see CLAUDE.md "Known Issues".
      # The postinstall script (scripts/patch-emnapi.js) handles this
      # automatically; this step is a belt-and-suspenders no-op.
      - name: Verify @emnapi lockfile patch
        run: node scripts/patch-emnapi.js

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build (production mode, staging env)
        env:
          NEXT_PUBLIC_IS_STAGING: "true"
        run: npm run build

      # Authenticate to the nilamit-staging GCP project. Requires:
      #   gcloud iam service-accounts add-iam-policy-binding \
      #     github-deployer@nilamit-staging.iam.gserviceaccount.com \
      #     --role=roles/iam.workloadIdentityUser \
      #     --member="principalSet://iam.googleapis.com/projects/...
      # See docs/STAGING.md for the full one-time setup.
      - name: Auth to GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_STAGING }}
          service_account: ${{ secrets.GCP_SA_STAGING }}

      - name: Deploy to staging App Hosting
        run: |
          npx -y firebase-tools apphosting:rollouts:create nilamit-staging \
            --project nilamit-staging \
            --git-branch ${{ github.head_ref }} \
            --force

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://nilamit-staging--nilamit-staging.asia-southeast1.hosted.app`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Staging deploy live at ${url}\n\nThis preview rebuilds on every push to this PR.`,
            });
