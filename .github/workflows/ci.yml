name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- TEST & VERIFY PHASE ---
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint check
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Run Unit & Integration Tests
        run: npx vitest run

  # --- BUILD & DEPLOY PHASE ---
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    # We use Google Cloud Run as the target for this example
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 💡 In a real setup, you would authenticate with your provider here:
      # - uses: 'google-github-actions/auth@v2'
      # - run: gcloud auth configure-docker

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Set to true after authenticating with a registry
          tags: gcr.io/${{ secrets.GCP_PROJECT_ID }}/nilamit-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deployment Success Notification
        run: echo "🚀 Nilamit App v${{ github.sha }} ready for rollout."
