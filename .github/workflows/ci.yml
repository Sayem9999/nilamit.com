name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # TODO: the package-lock.json was generated on Windows and omits
        # Linux-only optional native deps (e.g. @img/sharp-linux-*), causing
        # `npm ci` to fail on the lockfile integrity check. Regenerate the
        # lockfile inside a Linux container (or a devcontainer) once to fix:
        #   docker run --rm -v $(pwd):/app -w /app node:20 npm install
        # Then commit the result and revert this line to `npm ci`.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build smoke test
        run: npm run build
        env:
          NODE_ENV: production
          AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
          ADMIN_EMAILS: ci@example.com
          FIREBASE_PROJECT_ID: ci-placeholder
          FIREBASE_CLIENT_EMAIL: ci@ci-placeholder.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nci\n-----END PRIVATE KEY-----"
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
          UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder

# Deployment is handled automatically by Firebase App Hosting on push to main.
# No deploy job is needed here — Firebase App Hosting watches this branch and
# triggers a build+deploy via Cloud Build when the verify job passes.
# See: apphosting.yaml and cloudbuild.yaml for the build configuration.

  deploy-firestore:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules and Indexes
        run: firebase deploy --only firestore --project=nilamit-52073
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
