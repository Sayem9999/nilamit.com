name: Nilamit Cron Jobs

# All cron routes are POST (CLAUDE.md rule #6) and behind Bearer ${CRON_SECRET}.
# Base URL is the canonical custom domain. The old
# nilamit--nilamit-52073.asia-southeast1.hosted.app URL now serves the App
# Hosting 404 placeholder, which silently failed EVERY cron job.
#
# GitHub Actions enforces a 5-minute minimum cron interval — we can't run
# close-auctions every minute as documented. 5-minute granularity is fine in
# practice because bid validation already rejects post-endTime bids.

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 min  → close-auctions, process-alerts
    - cron: "*/15 * * * *"     # every 15 min → closing-soon
    - cron: "0 * * * *"        # hourly       → enforce-policies
    - cron: "0 3 * * *"        # daily 03:00 UTC → backup (managed Firestore export)
    - cron: "0 4 * * 0"        # weekly Sun 04:00 UTC → gc-uploads
  workflow_dispatch:
    inputs:
      job:
        description: "Specific job to run (close-auctions | closing-soon | process-alerts | enforce-policies | gc-uploads | saved-search-matches | all)"
        required: false
        default: "all"

env:
  BASE_URL: https://www.nilamit.com

jobs:

  close-auctions:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/close-auctions
        run: |
          curl --fail-with-body -sS -X POST "$BASE_URL/api/cron/close-auctions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' --max-time 300

  process-alerts:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/process-alerts
        run: |
          curl --fail-with-body -sS -X POST "$BASE_URL/api/cron/process-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' --max-time 300

  closing-soon:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/tasks/closing-soon
        run: |
          curl --fail-with-body -sS -X POST "$BASE_URL/api/tasks/closing-soon" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' --max-time 300

  # Saved-search match detector. Runs every 15 min — same cadence as
  # closing-soon because both are user-facing engagement loops. Per-tick
  # cost capped server-side at 500 saved searches × 25 matches = 12500
  # notify() calls max, well within Firestore + Upstash quotas. See
  # src/app/api/cron/saved-search-matches/route.ts for the match logic.
  saved-search-matches:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/saved-search-matches
        run: |
          curl --fail-with-body -sS -X POST "$BASE_URL/api/cron/saved-search-matches" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' --max-time 300

  enforce-policies:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/tasks/enforce-policies
        run: |
          curl --fail-with-body -sS -X POST "$BASE_URL/api/tasks/enforce-policies" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' --max-time 300

  # Daily managed Firestore export to GCS (autobackup). No-op until
  # BACKUP_GCS_BUCKET + IAM are provisioned — see src/app/api/cron/backup/route.ts.
  backup:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/backup
        run: |
          curl --fail-with-body -sS -X POST "$BASE_URL/api/cron/backup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' --max-time 300

  gc-uploads:
    if: github.event.schedule == '0 4 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/gc-uploads
        run: |
          curl --fail-with-body -sS -X POST "$BASE_URL/api/cron/gc-uploads" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --data '{}' --max-time 300
