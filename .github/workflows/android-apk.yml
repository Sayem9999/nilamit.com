name: Build Android APK

# Builds the Trusted Web Activity (TWA) APK from the live PWA manifest using
# Bubblewrap, signs it with a stable keystore, and publishes it so the in-app
# "Download Android APK" button (/downloads/nilamit.apk) serves it.
#
# Triggers: manual (workflow_dispatch) or pushing a version tag (v*).
#
# Required repository secrets (one-time — see docs/MOBILE.md):
#   ANDROID_KEYSTORE_BASE64    base64 of a keystore created with keytool
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_PASSWORD       key password
#   ANDROID_KEY_ALIAS          (optional) key alias; defaults to "nilamit"
#
# The keystore MUST be stable across runs — re-signing with a new key breaks
# updates for users who already installed a previous APK.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also create a GitHub Release with the APK"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Create a keystore (see docs/MOBILE.md) and add the ANDROID_* secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android.keystore
          echo "Keystore restored ($(stat -c%s android.keystore) bytes)."

      - name: Point Bubblewrap at the preinstalled JDK & Android SDK
        run: |
          # Without this, `bubblewrap` prompts to download its OWN JDK/SDK and
          # then defaults "No" to the Android SDK Terms — which fails in CI.
          # Pinning the paths to the runner's setup-java/setup-android installs
          # skips those prompts entirely.
          mkdir -p "$HOME/.bubblewrap"
          printf '{ "jdkPath": "%s", "androidSdkPath": "%s" }\n' "$JAVA_HOME" "$ANDROID_HOME" \
            > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          # Pre-accept SDK licenses so Gradle never blocks on them.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Generate Android project from twa-manifest.json
        run: |
          # Our committed twa-manifest.json (packageId, shortcuts, signingKey →
          # ./android.keystore alias nilamit) is the source of truth. `update`
          # regenerates the Gradle project from it — non-interactively now that
          # config.json points at the preinstalled JDK/SDK.
          bubblewrap update --skipVersionUpgrade

      - name: Build & sign APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Bubblewrap prompts for the keystore AND key passwords via inquirer,
          # which doesn't reliably consume two piped lines (the key prompt hit
          # EOF → exit 130). The store and key passwords are identical, so feed
          # the password on every line with `yes`: each prompt gets it and the
          # stream never ends. `yes` will SIGPIPE once Bubblewrap stops reading,
          # so disable pipefail and judge success by the signed APK existing.
          set +o pipefail
          yes "$KS_PASS" | bubblewrap build --skipPwaValidation
          echo "--- artifacts ---"; ls -la *.apk || true
          test -f app-release-signed.apk

      - name: Stage APK for in-app download
        run: |
          mkdir -p public/downloads
          if [ -f app-release-signed.apk ]; then
            cp app-release-signed.apk public/downloads/nilamit.apk
          else
            # Older Bubblewrap names it differently — grab the first signed apk.
            cp "$(ls -1 *-signed.apk app-release.apk 2>/dev/null | head -1)" public/downloads/nilamit.apk
          fi
          echo "APK size: $(stat -c%s public/downloads/nilamit.apk) bytes"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nilamit-apk
          path: public/downloads/nilamit.apk
          if-no-files-found: error

      - name: Publish APK to the site (commit to public/downloads)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/nilamit.apk
          if git diff --cached --quiet; then
            echo "APK unchanged — nothing to commit."
          else
            git commit -m "chore(android): publish signed APK [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: public/downloads/nilamit.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('apk-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Android APK build {0}', github.run_number) }}
          generate_release_notes: false
