# ═══════════════════════════════════════════════════════════════
# Firebase App Hosting — Backend Configuration
# ═══════════════════════════════════════════════════════════════
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# BEFORE FIRST DEPLOY — add every secret listed below:
#   echo -n "your-value" | gcloud secrets create SECRET_NAME \
#     --data-file=- --project=YOUR_PROJECT_ID
# ═══════════════════════════════════════════════════════════════

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  timeoutSeconds: 60

env:
  # ─── Node / Next.js ──────────────────────────────────────────
  - variable: NODE_ENV
    value: production

  # ─── Auth.js ─────────────────────────────────────────────────
  - variable: AUTH_SECRET
    secret: AUTH_SECRET     # openssl rand -base64 32

  - variable: AUTH_URL
    value: https://nilamit--nilamit-52073.asia-southeast1.hosted.app

  # ─── Google OAuth (optional) ─────────────────────────────────
  - variable: GOOGLE_CLIENT_ID
    secret: GOOGLE_CLIENT_ID

  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET

  # ─── Admin ───────────────────────────────────────────────────
  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS    # comma-separated admin emails

  # ─── Cron Security ───────────────────────────────────────────
  - variable: CRON_SECRET
    secret: CRON_SECRET     # openssl rand -hex 32

  # ─── Firebase Admin SDK (server-side) ────────────────────────
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID         # e.g. nilamit-app

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL       # service account email

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY        # service account private key (with \n newlines)

  - variable: FIREBASE_DATABASE_URL
    secret: FIREBASE_DATABASE_URL       # https://{project}-default-rtdb.firebaseio.com

  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET     # {project}.firebasestorage.app

  # ─── Firebase Client SDK (browser — NEXT_PUBLIC_*) ───────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: FIREBASE_WEB_API_KEY        # Web API key from Firebase Console

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID         # reuse server secret

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: FIREBASE_MESSAGING_SENDER_ID

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: FIREBASE_APP_ID

  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    secret: FIREBASE_DATABASE_URL       # reuse server secret

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET     # reuse server secret

  # ─── App URL (used in email links) ───────────────────────────
  - variable: NEXT_PUBLIC_APP_URL
    value: https://nilamit--nilamit-52073.asia-southeast1.hosted.app

  # ─── SMS Gateway ─────────────────────────────────────────────
  # SMS provider intentionally omitted until a real gateway is provisioned.
  # The factory in src/lib/sms-gateway.ts is lazy and will hard-fail at first
  # sendSMS() call in production until SMS_PROVIDER + the matching token
  # secret (GREENWEB_TOKEN, BULKSMS_API_KEY+BULKSMS_SENDER_ID) are added here.

  # ─── Sentry (optional) ───────────────────────────────────────
  # - variable: SENTRY_DSN
  #   secret: SENTRY_DSN
  # - variable: NEXT_PUBLIC_SENTRY_DSN
  #   secret: SENTRY_DSN
