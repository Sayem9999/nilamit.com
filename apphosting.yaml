runConfig:
  minInstances: 1
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  timeoutSeconds: 60

env:
  - variable: NODE_ENV
    value: production

  - variable: AUTH_SECRET
    secret: AUTH_SECRET

  - variable: AUTH_URL
    secret: APP_URL

  - variable: AUTH_TRUST_HOST
    value: "true"

  - variable: GOOGLE_CLIENT_ID
    secret: GOOGLE_CLIENT_ID

  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET

  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS

  - variable: CRON_SECRET
    secret: CRON_SECRET

  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY

  - variable: FIREBASE_DATABASE_URL
    secret: FIREBASE_DATABASE_URL

  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: FIREBASE_WEB_API_KEY

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: FIREBASE_MESSAGING_SENDER_ID

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: FIREBASE_APP_ID

  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    secret: FIREBASE_DATABASE_URL

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET

  - variable: NEXT_PUBLIC_APP_URL
    secret: APP_URL

  - variable: UPSTASH_REDIS_REST_URL
    secret: UPSTASH_REDIS_REST_URL

  - variable: UPSTASH_REDIS_REST_TOKEN
    secret: UPSTASH_REDIS_REST_TOKEN

  - variable: SENTRY_DSN
    secret: SENTRY_DSN

  - variable: NEXT_PUBLIC_SENTRY_DSN
    secret: SENTRY_DSN

  - variable: SENTRY_AUTH_TOKEN
    secret: SENTRY_AUTH_TOKEN

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY

  # Cloud Vision SafeSearch is active in production. The image-moderation
  # module fails open (allows the upload + logs to Sentry) if the Vision API
  # is unreachable, so a brief outage won't brick listings.
  - variable: IMAGE_MODERATION
    value: enabled

  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: "6Leg4fUsAAAAAIITIGqtUG5pzOqB5WX7F3tbD5be"

  # ─── BigQuery analytics sink ────────────────────────────────────────
  # Dataset + table are provisioned in nilamit-52073. The shipper
  # auto-uses the App Hosting service account (ADC) — no key file needed.
  # Grant the SA the role at deploy time:
  #   gcloud projects add-iam-policy-binding nilamit-52073 \
  #     --member="serviceAccount:firebase-app-hosting-compute@nilamit-52073.iam.gserviceaccount.com" \
  #     --role="roles/bigquery.dataEditor"
  - variable: BIGQUERY_DATASET
    value: nilamit_events
  - variable: BIGQUERY_TABLE
    value: events

  # ─── Automated backups ──────────────────────────────────────────────
  # Daily managed Firestore export (POST /api/cron/backup, scheduled in
  # .github/workflows/cron.yml). Bucket is US multi-region to match the
  # (default) Firestore database in nam5. SA firebase-adminsdk-fbsvc has
  # roles/datastore.importExportAdmin + storage.objectAdmin on the bucket.
  # 30-day object lifecycle keeps storage bounded.
  - variable: BACKUP_GCS_BUCKET
    value: nilamit-52073-backups

  # ─── SSLCommerz gateway ─────────────────────────────────────────────
  # Set SSLCOMMERZ_STORE_ID + SSLCOMMERZ_STORE_PASSWORD in Secret Manager
  # to activate the /api/payments/sslcommerz/* routes. Until then the init
  # endpoint returns 503 and bKash/Nagad keep working. Set to "true" while
  # using sandbox merchant credentials; remove or set to "false" for prod.
  - variable: SSLCOMMERZ_SANDBOX
    value: "true"

  # ─── FCM browser push (active) ──────────────────────────────────────
  # Public VAPID key — ships in the client bundle by design. Stored in
  # Secret Manager mainly for centralized rotation, not confidentiality.
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    secret: NEXT_PUBLIC_FIREBASE_VAPID_KEY

  # ─── SSLCommerz card/net-banking gateway — pending creds ───────────
  # The existing /api/payments/callback handles both production SSLCommerz
  # form-POSTs (with hash verification) and developer test JSON triggers.
  # No separate /api/payments/sslcommerz/* routes exist — the redundant
  # scaffolding was removed.
  #
  # To activate production card payments, set SSLCOMMERZ_STORE_PASSWORD
  # (the callback uses it to verify the hash signature). The dev-test
  # path requires PAYMENT_WEBHOOK_SECRET instead.
  #
  # - variable: SSLCOMMERZ_STORE_PASSWORD
  #   secret: SSLCOMMERZ_STORE_PASSWORD
  # - variable: PAYMENT_WEBHOOK_SECRET
  #   secret: PAYMENT_WEBHOOK_SECRET

  # ─── Typesense search engine — pending provisioning ─────────────────
  # Fronts keyword search (see docs/SEARCH.md). Until TYPESENSE_HOST +
  # TYPESENSE_API_KEY are set, src/lib/search-engine.ts no-ops and the
  # reader falls back to the legacy in-memory scan — nothing breaks.
  #
  # Activation:
  #   1. Provision Typesense in-region (Singapore/Mumbai for BD latency).
  #   2. Store the ADMIN api key in Secret Manager:
  #        firebase apphosting:secrets:set TYPESENSE_API_KEY \
  #          --project nilamit-52073 --data-file -
  #        firebase apphosting:secrets:grantaccess TYPESENSE_API_KEY \
  #          --project nilamit-52073 --backend nilamit
  #   3. Uncomment the block below, set the real host, deploy.
  #   4. Backfill the catalog:
  #        TYPESENSE_HOST=... TYPESENSE_API_KEY=... npx tsx scripts/backfill-search.ts
  #
  # TYPESENSE_PROTOCOL defaults to https, TYPESENSE_PORT to 443,
  # TYPESENSE_COLLECTION to "auctions" — only override if non-standard.
  #
  # - variable: TYPESENSE_HOST
  #   value: "xxxxxxxxxx.a1.typesense.net"   # Typesense Cloud host, or your self-hosted DNS
  # - variable: TYPESENSE_API_KEY
  #   secret: TYPESENSE_API_KEY
  # - variable: TYPESENSE_PORT
  #   value: "443"

  # ─── Courier integration — pending creds ────────────────────────────
  # One-click shipment booking + tracking (see docs/PAYMENTS.md / courier.ts).
  # Until COURIER_API_KEY + COURIER_SECRET_KEY are set, createLogisticsOrder
  # uses the internal NILAMIT_EXPRESS tracking id (today's behavior). Set them
  # to switch on real booking with a BD courier (Steadfast by default).
  # Status updates POST to /api/courier/webhook (auth via COURIER_WEBHOOK_SECRET).
  #
  # - variable: COURIER_PROVIDER
  #   value: "steadfast"
  # - variable: COURIER_API_KEY
  #   secret: COURIER_API_KEY
  # - variable: COURIER_SECRET_KEY
  #   secret: COURIER_SECRET_KEY
  # - variable: COURIER_WEBHOOK_SECRET
  #   secret: COURIER_WEBHOOK_SECRET

